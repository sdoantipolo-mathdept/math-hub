<!-- MAP AND CONTACT SECTION -->
   <style>
    /* CSS RESET & VARIABLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary-color: #0d47a1; /* DepEd Blue accent */
      --text-dark: #1f2937;
      --text-muted: #4b5563;
      --bg-card: #ffffff;
      --border-color: #e5e7eb;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: var(--text-dark);
      padding: 2rem 1rem;
    }

    /* SECTION CONTAINER */
    .contact-section {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      background-color: var(--bg-card);
      padding: 2.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    /* DESKTOP 2-COLUMN LAYOUT */
    @media (min-width: 900px) {
      .contact-section {
        grid-template-columns: 1fr 1.2fr;
        align-items: center;
      }
    }

    /* LEFT SIDE: CAPTIONS & INFO */
    .contact-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .contact-info h2 {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--primary-color);
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .contact-info h3 {
      font-size: 1.5rem;
      line-height: 1.3;
      color: var(--text-dark);
      margin-bottom: 1rem;
    }

    .divider {
      height: 2px;
      width: 100%;
      background: linear-gradient(90deg, var(--primary-color) 0%, #93c5fd 50%, var(--border-color) 100%);
      border: none;
      margin: 0.5rem 0 1.5rem 0;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    .info-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      background-color: #eff6ff;
      color: var(--primary-color);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info-content p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .info-content a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .info-content a:hover {
      text-decoration: underline;
    }

    /* RIGHT SIDE: ENHANCED MAP WRAPPER */
    .map-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 400px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .map-wrapper:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.1);
    }

    .map-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
